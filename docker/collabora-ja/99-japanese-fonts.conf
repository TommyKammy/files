<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer the requested Hina Mincho as the document serif/default face. -->
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>Liberation Serif</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>DejaVu Serif</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>


  <!-- Collabora/LibreOffice can select Noto Serif as the unresolved CJK default. -->
  <alias binding="same">
    <family>Noto Serif SC</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Serif JP</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Serif CJK SC</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Serif CJK JP</family>
    <prefer><family>Hina Mincho</family></prefer>
  </alias>
  <!-- Japanese sans fallbacks keep Noto Sans CJK JP for UI/heading readability. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Hina Mincho</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Mincho</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Hina Mincho</string>
    </edit>
  </match>
</fontconfig>
